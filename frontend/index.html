    <!-- Service Worker Registration -->
    <script>
        if ("serviceWorker" in navigator) {
            // Check if running in Electron before attempting registration
            const isElectron =
                (typeof window !== "undefined" &&
                    window.process &&
                    window.process.type === "renderer") ||
                (typeof window !== "undefined" &&
                    window.__ELECTRON_API_BASE__ !== undefined) ||
                navigator.userAgent.includes("Electron");
            const isDevLocalhost =
                location.hostname === "localhost" && location.port === "3000";

            // Skip service worker registration in Electron or dev mode
            if (!isElectron && !isDevLocalhost) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("/sw.js")
                        .then((registration) => {
                            console.log("SW registered: ", registration);
                        })
                        .catch((registrationError) => {
                            // Silently handle service worker registration errors
                            if (!registrationError.message ||
                                !registrationError.message.includes(
                                    "Service workers disabled"
                                )
                            ) {
                                console.log("SW registration failed: ", registrationError);
                            }
                        });
                });
            }
        }
    </script>
